services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hibi
      POSTGRES_USER: hibi
      POSTGRES_PASSWORD: hibi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hibi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hibi -d hibi"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  hibi-postgres-data:
